name: Notifiche push

on:
  schedule:
    # ogni 5 minuti (il minimo consentito; i cron di Actions partono comunque
    # con qualche minuto di ritardo nelle ore di punta)
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Invia solo una notifica di prova'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund firebase-admin web-push
      - run: node scripts/notify.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          TEST_PUSH: ${{ inputs.test && '1' || '' }}
